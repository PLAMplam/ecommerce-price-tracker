name: Price Tracker Web Deployment

on:
  schedule:
    - cron: '0 */6 * * *'  # รันอัปเดตราคาและหน้าเว็บทุก 6 ชั่วโมง
  workflow_dispatch:

jobs:
  track-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Run Price Tracker
        run: python tracker.py

      - name: Commit & Push Price Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add price_data.json price_history.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: price data & history [skip ci]" && git push)
